services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: to_do_list_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: to_do_list_app
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: to_do_list_postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
